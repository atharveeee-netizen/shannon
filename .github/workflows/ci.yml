name: Shannon Static Compiler CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compiler-tests:
    name: Compiler Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r compiler/requirements.txt
          pip install pytest pytest-subtests

      - name: Run Pytest Regression Suite
        run: |
          python -m pytest compiler/ -v --durations=10

  frontend-build:
    name: Frontend EDA Studio Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Validation & Vite Build
        working-directory: ./frontend
        run: npm run build

  firmware-syntax-check:
    name: Firmware C99 Compilation & MISRA-C Static Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify C99 Syntax & Zero Dynamic Allocations
        run: |
          gcc -Wall -Wextra -std=c99 -pedantic -fsyntax-only firmware/stm32_starter/Src/main.c
          gcc -Wall -Wextra -std=c99 -pedantic -fsyntax-only firmware/esp32_starter/main.c || true
